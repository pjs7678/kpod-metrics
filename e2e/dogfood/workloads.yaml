# Dogfood workloads: each pod drives one signal into a known, extreme state so the
# exported metrics can be checked against ground truth. Apply to a real (non-nested) cluster:
#   kubectl apply -f e2e/dogfood/workloads.yaml
# then run e2e/dogfood/verify.sh. Delete with: kubectl delete ns kpod-dogfood
apiVersion: v1
kind: Namespace
metadata:
  name: kpod-dogfood
---
# CPU throttling: 2 busy loops under a 100m quota -> throttled ~95% of periods.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cpu-throttled, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: cpu-throttled } }
  template:
    metadata: { labels: { app: cpu-throttled } }
    spec:
      containers:
        - name: burn
          image: busybox:1.36
          command: ["sh", "-c", "for i in 1 2; do (while :; do :; done) & done; wait"]
          resources: { requests: { cpu: 50m }, limits: { cpu: 100m, memory: 32Mi } }
---
# Run-queue contention: 12 unthrottled spinners on a 4-CPU node -> run-queue waits well
# past the old 67 ms histogram ceiling for everything on the node.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cpu-hog, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: cpu-hog } }
  template:
    metadata: { labels: { app: cpu-hog } }
    spec:
      containers:
        - name: burn
          image: busybox:1.36
          command: ["sh", "-c", "for i in $(seq 12); do (while :; do :; done) & done; wait"]
          resources: { requests: { cpu: 10m }, limits: { memory: 32Mi } }
---
# Memory near limit: repeatedly holds ~100 MiB of a 128 MiB limit (tail buffers the
# newline-free stream in anonymous memory), so RSS/limit swings up to ~80%.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mem-pressure, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: mem-pressure } }
  template:
    metadata: { labels: { app: mem-pressure } }
    spec:
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "while :; do head -c 100m /dev/zero | tail > /dev/null; sleep 2; done"]
          resources: { requests: { memory: 128Mi }, limits: { memory: 128Mi, cpu: 200m } }
---
# Disk IO: 4 parallel O_DIRECT 4 MiB writers + fsync -> deep queue, per-request latency
# in the tens to hundreds of ms. Each writer overwrites one fixed 64 MiB file in place
# (conv=notrunc, no rm): writing fresh files grows a VM's sparse disk image on the host by
# gigabytes per minute, which is how this workload once filled a laptop disk.
apiVersion: apps/v1
kind: Deployment
metadata: { name: disk-writer, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: disk-writer } }
  template:
    metadata: { labels: { app: disk-writer } }
    spec:
      containers:
        - name: dd
          image: busybox:1.36
          command: ["sh", "-c", "for i in 1 2 3 4; do (while :; do dd if=/dev/zero of=/data/f$i bs=4M count=16 oflag=direct conv=notrunc,fsync 2>/dev/null; done) & done; wait"]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { limits: { cpu: 300m, memory: 64Mi } }
      volumes: [{ name: data, emptyDir: {} }]
---
# HTTP server: /ok -> 200, /fail -> 503.
apiVersion: v1
kind: ConfigMap
metadata: { name: web-conf, namespace: kpod-dogfood }
data:
  default.conf: |
    server {
      listen 8080;
      location /ok   { return 200 "ok\n"; }
      location /fail { return 503 "down\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d }]
          resources: { limits: { cpu: 200m, memory: 64Mi } }
      volumes: [{ name: conf, configMap: { name: web-conf } }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: kpod-dogfood }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
# HTTP client with 150 ms of added egress delay (netem) -> TCP RTT ~150 ms, i.e. past the
# old 67 ms ceiling. ~25% of requests hit /fail (5xx). New connection per request.
apiVersion: apps/v1
kind: Deployment
metadata: { name: client, namespace: kpod-dogfood }
spec:
  replicas: 1
  selector: { matchLabels: { app: client } }
  template:
    metadata: { labels: { app: client } }
    spec:
      containers:
        - name: curl
          image: alpine:3.20
          securityContext: { capabilities: { add: ["NET_ADMIN"] } }
          command:
            - sh
            - -c
            - |
              # retry: right after a node restart DNS may not be ready yet
              until apk add --no-cache curl iproute2-tc >/dev/null 2>&1; do sleep 5; done
              tc qdisc replace dev eth0 root netem delay 150ms
              i=0
              while :; do
                i=$((i+1))
                if [ $((i % 4)) -eq 0 ]; then p=fail; else p=ok; fi
                curl -s -o /dev/null http://web.kpod-dogfood.svc/$p
                sleep 0.2
              done
          resources: { limits: { cpu: 100m, memory: 64Mi } }
