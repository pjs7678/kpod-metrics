[project]
name = "kpod-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants (Claude Code, Claude Desktop, Cursor, ...) explore and diagnose kpod-metrics data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
kpod-mcp = "kpod_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpod_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
