{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kpod-metrics.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kpod-metrics.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      # kpod's namespace/pod/container labels describe the *monitored* pod. Without this,
      # Prometheus Operator overwrites them with the DaemonSet pod's own target labels and
      # renames ours to exported_*, breaking dashboards, alerts and per-pod queries.
      honorLabels: true
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
