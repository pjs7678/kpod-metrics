{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kpod-metrics.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: kpod-metrics.recording
      rules:
        - record: kpod:cpu_runqueue_latency:p50
          expr: histogram_quantile(0.50, sum by (le, pod, namespace, node) (rate(kpod_cpu_runqueue_latency_seconds_bucket[5m])))

        - record: kpod:cpu_runqueue_latency:p90
          expr: histogram_quantile(0.90, sum by (le, pod, namespace, node) (rate(kpod_cpu_runqueue_latency_seconds_bucket[5m])))

        - record: kpod:cpu_runqueue_latency:p99
          expr: histogram_quantile(0.99, sum by (le, pod, namespace, node) (rate(kpod_cpu_runqueue_latency_seconds_bucket[5m])))

        - record: kpod:tcp_rtt:p50
          expr: histogram_quantile(0.50, sum by (le, pod, namespace, node) (rate(kpod_net_tcp_rtt_seconds_bucket[5m])))

        - record: kpod:tcp_rtt:p90
          expr: histogram_quantile(0.90, sum by (le, pod, namespace, node) (rate(kpod_net_tcp_rtt_seconds_bucket[5m])))

        - record: kpod:tcp_rtt:p99
          expr: histogram_quantile(0.99, sum by (le, pod, namespace, node) (rate(kpod_net_tcp_rtt_seconds_bucket[5m])))

        - record: kpod:syscall_latency:p50
          expr: histogram_quantile(0.50, sum by (le, pod, namespace, node) (rate(kpod_syscall_latency_seconds_bucket[5m])))

        - record: kpod:syscall_latency:p90
          expr: histogram_quantile(0.90, sum by (le, pod, namespace, node) (rate(kpod_syscall_latency_seconds_bucket[5m])))

        - record: kpod:syscall_latency:p99
          expr: histogram_quantile(0.99, sum by (le, pod, namespace, node) (rate(kpod_syscall_latency_seconds_bucket[5m])))

        - record: kpod:disk_io_latency:p50
          expr: histogram_quantile(0.50, sum by (le, pod, namespace, node) (rate(kpod_disk_io_latency_seconds_bucket[5m])))

        - record: kpod:disk_io_latency:p90
          expr: histogram_quantile(0.90, sum by (le, pod, namespace, node) (rate(kpod_disk_io_latency_seconds_bucket[5m])))

        - record: kpod:disk_io_latency:p99
          expr: histogram_quantile(0.99, sum by (le, pod, namespace, node) (rate(kpod_disk_io_latency_seconds_bucket[5m])))

        - record: kpod:tcp_retransmit_rate:5m
          expr: sum by (pod, namespace, node) (rate(kpod_net_tcp_retransmits_total[5m]))

        - record: kpod:tcp_drop_rate:5m
          expr: sum by (pod, namespace, node) (rate(kpod_net_tcp_drops_total[5m]))

        - record: kpod:syscall_error_ratio:5m
          expr: >-
            sum by (pod, namespace, node) (rate(kpod_syscall_errors_total[5m]))
            / clamp_min(sum by (pod, namespace, node) (rate(kpod_syscall_count_total[5m])), 1)

        - record: kpod:fs_usage_ratio
          expr: kpod_fs_usage_bytes / clamp_min(kpod_fs_capacity_bytes, 1)

        - record: kpod:collector_skip_rate:5m
          expr: sum by (collector, instance) (rate(kpod_collector_skipped_total[5m]))

    - name: kpod-metrics
      rules:
        - alert: KpodHighRunqueueLatency
          # Seconds. Bucket edges are powers of two (2^(s+11) ns); the last finite edge is 2^32 ns
          # (~4.3 s), so thresholds must stay below that or the alert can never fire.
          expr: histogram_quantile(0.99, sum by (le, pod, namespace) (rate(kpod_cpu_runqueue_latency_seconds_bucket[5m]))) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU runqueue latency on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} has p99 runqueue latency > 50ms for 5 minutes."

        - alert: KpodHighTcpRetransmitRate
          expr: sum by (pod, namespace) (rate(kpod_net_tcp_retransmits_total[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High TCP retransmit rate on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} has > 10 TCP retransmits/s for 5 minutes."

        - alert: KpodTcpDropsDetected
          expr: sum by (pod, namespace) (rate(kpod_net_tcp_drops_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TCP drops detected on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is experiencing TCP drops."

        - alert: KpodHighSyscallErrorRate
          # Errors are ret < 0 with no errno breakdown, so syscalls whose "errors" are normal flow
          # control are excluded: EAGAIN on non-blocking read/recv, futex timeouts, EINPROGRESS
          # from non-blocking connect. Unfiltered at 5% this fired on nearly every pod in dogfooding.
          # openat is excluded too (ENOENT from PATH/config probing). Still heuristic, hence info.
          expr: >-
            sum by (pod, namespace, syscall) (rate(kpod_syscall_errors_total{syscall!~"read|recvfrom|recvmsg|futex|epoll_wait|epoll_pwait|connect|accept|accept4|openat|open"}[5m]))
            / sum by (pod, namespace, syscall) (rate(kpod_syscall_count_total{syscall!~"read|recvfrom|recvmsg|futex|epoll_wait|epoll_pwait|connect|accept|accept4|openat|open"}[5m]))
            > 0.2
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "High {{`{{ $labels.syscall }}`}} error rate on {{`{{ $labels.pod }}`}}"
            description: "{{`{{ $labels.syscall }}`}} fails for more than 20% of calls in pod {{`{{ $labels.pod }}`}} ({{`{{ $labels.namespace }}`}}) for 15 minutes."

        - alert: KpodFilesystemAlmostFull
          expr: (kpod_fs_usage_bytes / kpod_fs_capacity_bytes) > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Filesystem almost full on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} filesystem usage is above 90%."

        - alert: KpodBpfMapNearCapacity
          expr: (kpod_bpf_map_entries / kpod_bpf_map_capacity) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "BPF map {{`{{ $labels.map }}`}} near capacity"
            description: "BPF map {{`{{ $labels.map }}`}} is above 80% utilization for 5 minutes."

        - alert: KpodBpfMapUpdateErrors
          expr: rate(kpod_bpf_map_update_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "BPF map update errors on {{`{{ $labels.map }}`}}"
            description: "BPF map {{`{{ $labels.map }}`}} is experiencing update errors, metrics may be lost."

        - alert: KpodTargetDown
          expr: up{job=~".*kpod-metrics.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kpod-metrics target down on {{`{{ $labels.instance }}`}}"
            description: "kpod-metrics instance {{`{{ $labels.instance }}`}} has been unreachable for 5 minutes."

        - alert: KpodCollectorErrors
          expr: sum by (collector, instance) (rate(kpod_collector_errors_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Collector {{`{{ $labels.collector }}`}} errors on {{`{{ $labels.instance }}`}}"
            description: "Collector {{`{{ $labels.collector }}`}} has been failing for 5 minutes."

        - alert: KpodNoBpfPrograms
          expr: kpod_bpf_programs_loaded == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No BPF programs loaded on {{`{{ $labels.instance }}`}}"
            description: "kpod-metrics instance {{`{{ $labels.instance }}`}} has zero BPF programs loaded for 5 minutes."

        - alert: KpodNoPodsDiscovered
          # Without discovered pods nothing is attributed: the scrape keeps only kpod's own
          # metrics while the pod stays Ready. Usually the API server is unreachable (check
          # networkPolicy.apiServerPorts) or RBAC is missing.
          expr: kpod_discovery_pods == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "kpod-metrics on {{`{{ $labels.instance }}`}} sees no pods"
            description: "No pod cgroups resolved for 10 minutes, so no per-pod metrics are exported from this node. Check the pod logs for Kubernetes API errors (NetworkPolicy apiServerPorts, RBAC)."

        - alert: KpodBpfProgramsFailed
          # Partial failures leave whole metric families empty while the pod stays Ready.
          expr: kpod_bpf_programs_failed > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $value }}`}} BPF program(s) failed to load on {{`{{ $labels.instance }}`}}"
            description: "Some eBPF programs did not load or attach, so their metrics are missing. GET /actuator/kpodDiagnostics on the pod (or check its logs) for the cause; 'Permission denied' on Ubuntu/Debian nodes usually means kernel.perf_event_paranoid > 2."

        - alert: KpodCgroupReadErrors
          expr: sum by (collector, instance) (rate(kpod_cgroup_read_errors_total[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cgroup read errors in {{`{{ $labels.collector }}`}} on {{`{{ $labels.instance }}`}}"
            description: "Cgroup collector {{`{{ $labels.collector }}`}} is experiencing > 1 read error/s for 5 minutes."

        - alert: KpodCollectionTimeouts
          expr: rate(kpod_collection_timeouts_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Collection timeouts on {{`{{ $labels.instance }}`}}"
            description: "kpod-metrics instance {{`{{ $labels.instance }}`}} has been timing out for 10 minutes."

        - alert: KpodMemoryPressure
          expr: >-
            kpod_mem_cgroup_usage_bytes / kpod_mem_cgroup_peak_bytes > 0.95
            and kpod_mem_cgroup_usage_bytes > 100e6
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Memory pressure on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is using > 95% of peak memory (> 100MB) for 5 minutes."

        - alert: KpodCpuThrottled
          expr: >-
            rate(kpod_cpu_throttled_periods_total[5m]) / rate(kpod_cpu_periods_total[5m]) > 0.25
            and rate(kpod_cpu_periods_total[5m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CPU throttling on {{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}}"
            description: "Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is CFS-throttled in > 25% of scheduling periods. Raise the CPU limit or remove it."

        - alert: KpodMemoryNearLimit
          expr: >-
            kpod_mem_cgroup_rss_bytes / kpod_mem_cgroup_limit_bytes > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Memory near limit on {{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}}"
            description: "Non-reclaimable (RSS) memory of {{`{{ $labels.container }}`}} is > 90% of its limit; the next spike will OOM-kill it."

        - alert: KpodResourceStall
          expr: >-
            rate(kpod_pressure_stall_seconds_total{kind="some"}[5m]) > 0.3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $labels.resource }}`}} stall on {{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}}"
            description: "Tasks in {{`{{ $labels.container }}`}} were stalled waiting for {{`{{ $labels.resource }}`}} > 30% of wall time over 5 minutes (PSI)."

        - alert: KpodHighRestartRate
          expr: >-
            changes(kpod_container_restarts{namespace!="kube-system"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High restart rate on {{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}}"
            description: "Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} ({{`{{ $labels.namespace }}`}}) restarted > 3 times in 15 minutes."

        - alert: KpodPodCrashLooping
          expr: >-
            changes(kpod_container_restarts{namespace!="kube-system"}[30m]) > 5
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Crash loop detected on {{`{{ $labels.pod }}`}}/{{`{{ $labels.container }}`}}"
            description: "Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} ({{`{{ $labels.namespace }}`}}) restarted > 5 times in 30 minutes — likely crash looping."

        - alert: KpodHighCollectorSkipRate
          expr: >-
            sum by (collector, instance) (rate(kpod_collector_skipped_total[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High skip rate for collector {{`{{ $labels.collector }}`}} on {{`{{ $labels.instance }}`}}"
            description: "Collector {{`{{ $labels.collector }}`}} is being skipped > 10% of cycles for 10 minutes. Consider increasing its interval or the base poll-interval."

        - alert: KpodHighForkRate
          expr: >-
            sum by (pod, namespace) (rate(kpod_proc_forks_total[5m])) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High fork rate on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is forking > 100 processes/s for 5 minutes — possible fork bomb."

        - alert: KpodHighExecRate
          expr: >-
            sum by (pod, namespace) (rate(kpod_proc_execs_total[5m])) > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High exec rate on {{`{{ $labels.pod }}`}}"
            description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is executing > 50 processes/s for 5 minutes — investigate abnormal process spawning."
{{- end }}
